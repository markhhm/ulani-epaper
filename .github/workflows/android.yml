name: Android

# Builds the Android app (web/ packaged with Capacitor) as a debug build and
# keeps the installable package as a workflow artifact. On v* tags it also
# builds the release package, signed with the release key from the repository
# secrets, and attaches it to the release as Paperhue-Android.apk. Actions are
# pinned to commit SHAs; the comment names the release.

on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes: every v* tag builds.
    tags: ["v*"]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            web/android/**/*.gradle*
            web/android/gradle/wrapper/gradle-wrapper.properties

      # The runner ships an Android SDK (ANDROID_HOME); add exactly what the
      # project compiles against.
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build the debug package and run the unit tests
        working-directory: web/android
        run: bash ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paperhue-android-debug
          path: web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tags only. The key is written to a temporary file for this step and
      # removed after it; it never enters the repository.
      - name: Build the signed release package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          export PAPERHUE_VERSION="${GITHUB_REF_NAME#v}"
          bash ./gradlew assembleRelease --no-daemon --stacktrace
          apk="$RUNNER_TEMP/apk/Paperhue-Android.apk"
          mkdir -p "$(dirname "$apk")"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep "Signer #1 certificate"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Paperhue-Android
          path: ${{ runner.temp }}/apk/Paperhue-Android.apk
          if-no-files-found: error

  release:
    # Tags only: attach the APK to the release that python.yml creates for the same tag.
    name: attach Paperhue-Android.apk
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Paperhue-Android
          path: dist
      - name: Wait for the release, then upload the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$TAG" dist/Paperhue-Android.apk --clobber --repo "$REPO"
