name: Web

# Tests and builds the web app (web/). On main (and by hand, and every day) it then publishes
# web/dist to GitHub Pages; pull requests only run the tests and the build.
#
# The default calendar (Taiwan's public holidays, shown when the user has no calendar) is public
# data that a browser cannot read from Google, so every build downloads it, converts it with the
# Python reference and puts it on the site next to the app (web/dist/data/tw-holidays.json). The
# daily run keeps that copy current; scheduled runs only start from the default branch. GitHub switches
# scheduled workflows off after 60 days without activity in the repository: the copy therefore covers
# everything up to the end of next year, and re-enabling the workflow (Actions tab) refreshes it.
# Pages must be set to "GitHub Actions" as its source (Settings > Pages).
# Actions are pinned to commit SHAs; the comment names the release.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "python/src/ulani_epaper/fonts/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "python/src/ulani_epaper/fonts/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *" # every day at 00:17 in Taiwan

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a running
# deploy. Pull requests get a group of their own and replace older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # After the build: it empties dist/. A failed download or a file that is not a calendar fails
      # the run, so the site keeps the copy it has.
      - name: default calendar (Taiwan holidays)
        working-directory: .
        run: |
          python -m pip install "./python[calendar]"
          PYTHONPATH=python/src python web/scripts/tw_holidays.py web/dist/data/tw-holidays.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
