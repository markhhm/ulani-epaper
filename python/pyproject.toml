[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ulani-epaper"
version = "0.2.2"
description = "Paperhue: desktop app and Python library for ULANI 7-colour e-paper devices (Bluetooth LE)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["paperhue", "e-paper", "eink", "bluetooth-low-energy", "ble", "bleak", "ulani"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "bleak>=0.22",
    "Pillow>=10.1",
]

[project.urls]
Homepage = "https://github.com/markhhm/ulani-epaper"
Issues = "https://github.com/markhhm/ulani-epaper/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ulani = "ulani_epaper.cli:main"

[project.gui-scripts]
paperhue = "ulani_epaper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The app icon (made by shared/brand/make_icons.py); gui.py loads it with importlib.resources.
ulani_epaper = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
