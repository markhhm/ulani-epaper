[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ulani-epaper"
version = "0.3.0"
description = "Paperhue: desktop app and Python library for ULANI 7-colour e-paper devices (Bluetooth LE)"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/ulani_epaper/fonts/OFL.txt"]
requires-python = ">=3.10"
keywords = ["paperhue", "e-paper", "eink", "bluetooth-low-energy", "ble", "bleak", "ulani"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "bleak>=0.22",
    "Pillow>=10.1",
]

[project.urls]
Homepage = "https://github.com/markhhm/ulani-epaper"
Issues = "https://github.com/markhhm/ulani-epaper/issues"

[project.optional-dependencies]
# Calendar and to-do pages from iCal (.ics) addresses
calendar = [
    "icalendar>=7.2.2",  # 7.2.2 fixes GHSA-qjcq-q7h7-r74v (VALARM REPEAT)
    "keyring>=24",
]
dev = ["pytest>=8"]

[project.scripts]
ulani = "ulani_epaper.cli:main"

[project.gui-scripts]
paperhue = "ulani_epaper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ulani_epaper = ["fonts/*.otf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
