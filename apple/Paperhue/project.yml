# XcodeGen spec for the Paperhue app (iOS 17+ / macOS 14+, one multiplatform target).
# The app is a thin shell around PaperhueUI (../UlaniKit). After editing this file run
#   xcodegen generate --spec apple/Paperhue/project.yml
# and commit the regenerated Paperhue.xcodeproj (CI checks that it is up to date).
# Signing: set DEVELOPMENT_TEAM in Config/Signing.local.xcconfig (git-ignored), not in Xcode's
# Signing & Capabilities pane, which would edit the generated project. CI builds with
# CODE_SIGNING_ALLOWED=NO.
# Xcode upgrades: if Xcode offers "Update to recommended settings", do not perform it (it edits
# the generated project, so CI fails and the next generate undoes it). Copy the settings it
# lists into `settings` below, raise options.xcodeVersion to that Xcode, and regenerate.
name: Paperhue
options:
  minimumXcodeGenVersion: 2.46.0
  # Written as LastUpgradeCheck. Xcode 16 matches the project format XcodeGen writes
  # (objectVersion 77) and is the oldest Xcode that builds UlaniKit (swift-tools-version 6.0).
  xcodeVersion: "16.0"
  # The only localization (zh-Hant.lproj holds just the bundle name for the macOS menu bar),
  # so system-provided UI (menus, pickers) matches the zh-TW interface.
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    # Recommended by Xcode's project settings check (and set by its Xcode 16 app template).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  UlaniKit:
    path: ../UlaniKit
targets:
  Paperhue:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Paperhue
        excludes:
          - Info-iOS.plist
      # Merged into the generated Info.plist, never copied as a resource.
      - path: Paperhue/Info-iOS.plist
        buildPhase: none
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: UlaniKit
        product: PaperhueUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.markhhm.paperhue
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 紙彩
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 需要藍牙才能把照片傳到 ULANI 電子紙裝置。
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iOS: UIBackgroundModes (bluetooth-central) has no INFOPLIST_KEY_ setting.
        "INFOPLIST_FILE[sdk=iphone*]": Paperhue/Info-iOS.plist
        # macOS: App Sandbox with Bluetooth and user-selected files (read-only).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Paperhue/Paperhue.entitlements
    scheme: {}
