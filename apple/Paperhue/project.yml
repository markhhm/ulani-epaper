# XcodeGen spec for Paperhue, the macOS app (macOS 14+). The app is a thin shell around
# PaperhueUI (../UlaniKit). After editing this file run
#   xcodegen generate --spec apple/Paperhue/project.yml
# and commit the regenerated Paperhue.xcodeproj (CI checks that it is up to date).
# Signing: set DEVELOPMENT_TEAM in Config/Signing.local.xcconfig (git-ignored), not in Xcode's
# Signing & Capabilities pane, which would edit the generated project. CI builds with
# CODE_SIGNING_ALLOWED=NO; release builds are signed ad hoc by scripts/build-macos.sh.
# Xcode upgrades: if Xcode offers "Update to recommended settings", do not perform it (it edits
# the generated project, so CI fails and the next generate undoes it). Copy the settings it
# lists into `settings` below, raise options.xcodeVersion to that Xcode, and regenerate.
name: Paperhue
options:
  minimumXcodeGenVersion: 2.46.0
  # Written as LastUpgradeCheck. Xcode 16 matches the project format XcodeGen writes
  # (objectVersion 77) and is the oldest Xcode that builds UlaniKit (swift-tools-version 6.0).
  xcodeVersion: "16.0"
  # Localizations: en.lproj, zh-Hant.lproj and zh-Hans.lproj (the bundle names; en.lproj also
  # the Bluetooth prompt). System-provided UI (menus, pickers) follows the system language,
  # English when it is none of these, and from the next launch the app's language toggle (it
  # sets AppleLanguages). The window starts in the same language (PaperhueUI/Language.swift).
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # Recommended by Xcode's project settings check (and set by its Xcode 16 app template).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  UlaniKit:
    path: ../UlaniKit
targets:
  Paperhue:
    type: application
    platform: macOS
    sources:
      - path: Paperhue
      # The daily sync's launch agent (SMAppService.agent), in Contents/Library/LaunchAgents.
      - path: LaunchAgents/io.github.markhhm.paperhue.sync.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: UlaniKit
        product: PaperhueUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.markhhm.paperhue
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 紙彩
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 需要藍牙才能把照片傳到 ULANI 電子紙裝置。
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # App Sandbox with Bluetooth, user-selected files (read-only) and outgoing network
        # connections (the calendar sources).
        CODE_SIGN_ENTITLEMENTS: Paperhue/Paperhue.entitlements
    scheme: {}
