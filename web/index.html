<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paperhue 紙彩 — ULANI e-paper</title>
    <meta
      name="description"
      content="Paperhue 紙彩：把照片放上 ULANI 永恆曆（ULANI e-paper）電子紙裝置，用瀏覽器或 Android App。Paperhue puts your photos on ULANI e-paper devices from a browser or the Android app."
    />
    <meta name="application-name" content="Paperhue" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paperhue 紙彩" />
    <meta property="og:title" content="Paperhue 紙彩 — ULANI e-paper" />
    <meta
      property="og:description"
      content="把照片放上 ULANI 永恆曆電子紙裝置。Put your photos on ULANI e-paper devices."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paperhue" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1c1c1e;
        --line: #d8d5cc;
        --accent: #1d5fbf;
        font-family: system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151515;
          --text: #f2f2f0;
          --line: #3a3a3e;
          --accent: #5b9bf0;
        }
      }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px 16px;
        background: var(--bg);
        color: var(--text);
      }
      a {
        color: var(--accent);
      }
      .shell {
        max-width: 40rem;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .topbar h1 {
        margin: 0;
        min-width: 0;
      }
      .lang-toggle {
        flex: none;
        min-width: 44px;
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .lang-toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .tagline {
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Replaced by the app once its script runs. -->
      <main class="shell">
        <h1>Paperhue 紙彩</h1>
        <p class="tagline">把照片放上 ULANI 永恆曆電子紙裝置。 <span lang="en">Put your photos on ULANI e-paper devices.</span></p>
      </main>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
